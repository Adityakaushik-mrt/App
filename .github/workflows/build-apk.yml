name: Build Android APK from Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Web Dependencies & Build
      run: |
        npm install --no-package-lock --legacy-peer-deps
        npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android Project via Capacitor
      run: |
        npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "My Daily Expenses" "com.mydailyexpenses.app" --web-dir dist
        npx cap add android
        npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyDailyExpenses-APK
        path: android/app/build/outputs/apk/debug/*.apk
